name: CI - Validação do Sinaleiro

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-api:
    name: Build, Lint e Testes (API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar tipos compartilhados (@sinaleiro/types)
        run: npm run build --workspace=@sinaleiro/types --if-present

      - name: Executar Lint (oxlint)
        run: npm run lint --workspace=apps/api

      - name: Compilar API (NestJS)
        run: npm run build --workspace=apps/api

      - name: Executar Testes Unitários (Vitest)
        env:
          NODE_ENV: test
        run: npm test --workspace=apps/api

  e2e-api:
    name: Testes E2E (API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [validar-api]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: sinaleiro_test
          TYPEORM_SYNCHRONIZE: 'false'
          TYPEORM_MIGRATIONS_RUN: 'true'
          THROTTLE_SHORT_LIMIT: '1000'
          THROTTLE_LIMIT: '1000'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sinaleiro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sinaleiro_test

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar tipos compartilhados (@sinaleiro/types)
        run: npm run build --workspace=@sinaleiro/types --if-present

      - name: Executar Testes E2E (Vitest + Supertest)
        run: npm run test:e2e --workspace=apps/api
