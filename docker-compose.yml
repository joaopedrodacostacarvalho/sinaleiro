services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: backend_api_dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - path: .env
        required: false
