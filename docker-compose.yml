services:
  db:
    image: postgres:17-alpine
    container_name: sinaleiro_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-sinaleiro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinaleiro_dev}
      POSTGRES_DB: ${DB_NAME:-sinaleiro_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinaleiro} -d ${DB_NAME:-sinaleiro_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: backend_api_dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - types_dist:/app/packages/types/dist
    command: >
      sh -c "npm run build --workspace=@sinaleiro/types &&
             (npm run migration:run --workspace=apps/api || true) &&
             (npm run dev --workspace=@sinaleiro/types &) &&
             npm run start:dev --workspace=apps/api"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: sinaleiro_web_dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - types_dist:/app/packages/types/dist
    command: >
      sh -c "npm run dev --workspace=@sinaleiro/web -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    env_file:
      - path: .env
        required: false

volumes:
  postgres_data:
  types_dist:
