services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER obrigatório}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatório}
      POSTGRES_DB: ${DB_NAME:?DB_NAME obrigatório}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sinaleiro_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      TYPEORM_SYNCHRONIZE: 'false'
      TYPEORM_MIGRATIONS_RUN: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sinaleiro_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sinaleiro_net

volumes:
  postgres_prod_data:

networks:
  sinaleiro_net:
    driver: bridge
