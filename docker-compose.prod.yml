services:
  db:
    image: postgres:17-alpine
    container_name: sinaleiro_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER é obrigatório em produção}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD é obrigatório em produção}
      POSTGRES_DB: ${DB_NAME:?DB_NAME é obrigatório em produção}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sinaleiro_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: sinaleiro_api_prod
    restart: always
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER é obrigatório em produção}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD é obrigatório em produção}
      DB_NAME: ${DB_NAME:?DB_NAME é obrigatório em produção}
      TYPEORM_SYNCHRONIZE: "false"
      TYPEORM_MIGRATIONS_RUN: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS é obrigatório em produção}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID é obrigatório}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?FIREBASE_CLIENT_EMAIL é obrigatório}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?FIREBASE_PRIVATE_KEY é obrigatório}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - sinaleiro_internal

networks:
  sinaleiro_internal:
    driver: bridge

volumes:
  postgres_data_prod:
